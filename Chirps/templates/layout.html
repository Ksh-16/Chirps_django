{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>
        {% block title %}
        Chirps
        {% endblock %}
    </title>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="{% url 'tweet_list' %}" class="navbar-brand">
                <span class="bird-icon">🐦</span>
                <span class="navbar-brand-text">Chirps</span>
            </a>
            <div class="navbar-nav">
                <a href="{% url 'tweet_list' %}">Home</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'tweet_create' %}">Create</a>
                {% endif %}
            </div>
            <div class="user-menu">
                {% if user.is_authenticated %}
                    <div class="user-avatar" title="Profile">
                        {{ user.username|upper|first }}
                    </div>
                    <a href="{% url 'logout' %}" style="text-decoration: none; font-size: 13px; color: #8b6f47; font-weight: 500;">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" style="text-decoration: none; font-size: 13px; color: #d4a574; font-weight: 600;">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container">
        {% block content %}
           
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
