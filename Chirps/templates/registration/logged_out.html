{% extends "layout.html" %}

{% block title %}
Chirps - Logged Out
{% endblock %}

{% block content %}
<div style="padding: 40px 24px;">
    <div class="form-section" style="max-width: 500px;">
        <div class="logout-container">
            <div class="logout-icon">👋</div>
            <h2 class="logout-title">You've Been Logged Out</h2>
            <p class="logout-message">
                Your session has ended safely. You can log back in anytime to continue chirping and connecting with your community.
            </p>
            <div class="logout-action">
                <a href="{% url 'tweet_list' %}">Back to Home</a>
                <a href="{% url 'login' %}">Sign In Again</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
